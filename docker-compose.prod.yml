name: core-prod

# Production overlay — di belakang nginx-proxy via network nginx-net (external).
# Aset JS di-build di host dulu (bun run build), public/hot dihapus.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  app:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://preview.smauiiyk.sch.id
      LOG_LEVEL: warning
      MAIL_MAILER: log
    volumes:
      - .:/var/www/html
      - ./env/.env.production:/var/www/html/.env:ro
      - /var/www/html/public/hot

  worker:
    image: core-app
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment:
      APP_ENV: production
    volumes:
      - .:/var/www/html
      - ./env/.env.production:/var/www/html/.env:ro
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    ulimits:
      core: 0
    networks:
      - smauii

  schedule:
    image: core-app
    command: php artisan schedule:work
    environment:
      APP_ENV: production
    volumes:
      - .:/var/www/html
      - ./env/.env.production:/var/www/html/.env:ro
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    ulimits:
      core: 0
    networks:
      - smauii

  mailpit:
    ports: !override
      - "127.0.0.1:${PROD_MAILPIT_PORT:-1026}:1025"
      - "127.0.0.1:${PROD_MAILPIT_DASHBOARD_PORT:-8026}:8025"

  pgsql:
    ports: !override
      - "127.0.0.1:${PROD_PGSQL_PORT:-5434}:5432"

  redis:
    ports: !override
      - "127.0.0.1:${PROD_REDIS_PORT:-6384}:6379"

  rustfs:
    ports: !override
      - "127.0.0.1:${PROD_RUSTFS_PORT:-9003}:9000"
      - "127.0.0.1:${PROD_RUSTFS_CONSOLE_PORT:-9093}:9001"
